name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
        project:
          - repository: nushell/nushell
            ref: refs/tags/0.109.1
            path: nushell

    runs-on: ${{ matrix.os }}

    steps:
      - name: Windows Config
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          git config --system core.longpaths true
          echo "Enabled long paths in git"

          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
          echo "Enabled long paths in registry"

          $git_link = "C:\Program Files\Git\usr\bin\link.exe"
          if (Test-Path $git_link) {
              Rename-Item $git_link "_link.exe"
          }
          echo "Removed link.exe in git"

      - name: Setup MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: 14.29
          arch: x64
          sdk: 10.0.19041.0

      - name: Checkout self
        uses: actions/checkout@v6

      - name: Checkout project
        uses: actions/checkout@v6
        with:
          repository: ${{ matrix.project.repository }}
          ref: ${{ matrix.project.ref }}
          path: ${{ matrix.project.path }}

      - name: Copy config file
        shell: bash
        run: |
          mkdir -p coreutils/.cargo
          cp -f .cargo/config.toml coreutils/.cargo

      - name: Build
        shell: bash
        working-directory: ${{ matrix.project.path }}
        run: |
          rm -f Cargo.lock
          cargo update
          cargo b -r --no-default-features --features ""

      - name: Archive
        uses: actions/upload-artifact@v5
        with:
          name: coreutils_${{ runner.os }}
          path: |
            ${{ matrix.core.path }}/target/release/*.so
            ${{ matrix.core.path }}/target/release/*.dll

            ${{ matrix.core.path }}/target/release/nu
            ${{ matrix.core.path }}/target/release/nu.exe
